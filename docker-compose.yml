name: komorebi

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-komorebi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-komorebi}
      POSTGRES_DB: ${POSTGRES_DB:-komorebi}
    volumes:
      - komorebi_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    restart: unless-stopped
    ports:
      - "${VOICEVOX_PORT:-50021}:50021"

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    init: true
    shm_size: "2gb"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-komorebi}:${POSTGRES_PASSWORD:-komorebi}@db:5432/${POSTGRES_DB:-komorebi}?schema=public
      SERVER_PORT: 4000
      RENDER_BASE_URL: http://localhost:4000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      CONTENT_SOURCE_MODE: ${CONTENT_SOURCE_MODE:-excel}
      VOICEVOX_URL: http://voicevox:50021
      VOICEVOX_SPEAKER_ID: ${VOICEVOX_SPEAKER_ID:-31}
      TYPECAST_API_KEY: ${TYPECAST_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      YOUTUBE_AUTO_UPLOAD: ${YOUTUBE_AUTO_UPLOAD:-false}
      EXPORT_ROOT: /app/exports
    ports:
      - "${SERVER_PORT:-4000}:4000"
    volumes:
      - komorebi_storage:/app/apps/server/storage
      - ./exports:/app/exports
    depends_on:
      db:
        condition: service_healthy
      voicevox:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-5173}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  komorebi_db_data:
  komorebi_storage:
